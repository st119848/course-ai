<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Todo List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="todo-app">
    <h1>Todo List</h1>

    <form id="todo-form" class="todo-form">
      <label class="sr-only" for="todo-input">New todo</label>
      <input id="todo-input" type="text" placeholder="What needs to be done?" autocomplete="off" required>
      <button type="submit">Add</button>
    </form>

    <ul id="todo-list" class="todo-list" aria-live="polite"></ul>
    <p id="empty-message" class="empty-message">No todos yet.</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
